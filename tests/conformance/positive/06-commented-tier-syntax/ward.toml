# sage.ward.toml — Sage familiar Ward v0.1
# This is the canonical Ward for Sage, OpenCoven's research familiar.
# It demonstrates a full familiar-contract v0.1 compliant Ward.

[meta]
version = "0.1.0"
familiar = "sage"
person = "val"
created = "2026-06-11"
last_modified = "2026-06-11"
author = "sage+val"

[protected]
files = [
  "SOUL.md",
  "IDENTITY.md",
  "MEMORY.md",
  "USER.md",
  "AGENTS.md",
  "ward.toml",
]

invariants = [
  "familiar.name == 'Sage'", # identity must stay stable
  "familiar.person == 'val'", # person binding is protected
  "familiar.pronouns == 'they/them'",
  "familiar.purpose includes 'research'",
  "familiar.tag == '#research'", # quoted # must be preserved
]

[editable]
paths = [
  "HEARTBEAT.md",
  "TOOLS.md",
  "notes/#archive/", # quoted # must not start a comment
  "skills/*/",
  "roles/*/",
]

harness_blocks = [
  "system_prompt.execution",
  "system_prompt.recovery",
  "tool_defaults",
  "skill_config",
  "subagent_templates",
  "output_formats",
  "heartbeat_schedule",
  "tool_grants",
  "skill_activations",
  "memory_conventions",
  "session_introduction",
]

[approval_tiers] # approval routing

[approval_tiers . auto] # automatic changes only
"blocks" = [
  "output_formats", # presentational templates
  "heartbeat_schedule", # scheduling only
  "tool_defaults", # execution defaults
]
"gate" = "regression_suite"
cave_board_card = true
human_veto_window_hours = 48

[approval_tiers.familiar_review] # familiar review surface
blocks = [
  "system_prompt.recovery", # recovery messaging
  "skill_config", # skill tuning
  "subagent_templates", # task wrappers
]
gate = "familiar_coherence_check"
cave_board_card = true
human_veto_window_hours = 24

[approval_tiers.human_review] # human sign-off tier
blocks = [
  "tool_grants", # capability escalation
  "skill_activations", # enablement changes
  "system_prompt.execution", # execution posture
]
gate = "human_approval"
cave_board_card = true

[approval_tiers.human_required] # explicit rationale required
blocks = [
  "memory_conventions", # persistent memory policy
  "session_introduction", # session framing
]
gate = "human_approval_with_rationale"
cave_board_card = true
audit_log = true

[audit]
log_path = "~/.coven/wards/audit/sage.ward.log"
retention_days = 365
log_all_proposals = true
log_rejections = true
log_approvals = true
